[package]
name = "stt-terminject"
version = "0.1.0"
edition = "2021"
description = "STT Terminal Injection Daemon — Push-to-Talk via Global Hotkeys"
rust-version = "1.77"

[[bin]]
name = "stt-terminject"
path = "src/main.rs"

[dependencies]
# STT Core — vendored offline Whisper-Engine.
# Basis: upstream openworker/stt @ v0.2.1 (https://github.com/andrewyng/openworker)
# Gegenüber upstream nur lokal: resample_mono/transcribe/WHISPER_SAMPLE_RATE
# public gemacht (Upstream hält sie private). Siehe vendor/ocw-stt/README.md
# Relativer vendor/-Pfad → Projekt ist vollautark baubar (kein git-Checkout nötig).
ocw-stt = { path = "vendor/ocw-stt" }

# Desktop Input Simulation
arboard = "3.4"
enigo = "0.2"

# Global Hotkey (X11 / Wayland)
global-hotkey = "0.6"

# HTTP Server (Remote/Android/Browser Access)
axum = { version = "0.7", features = ["tokio"] }
hyper = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Config & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Audio decode (WAV uploads)
hound = "3.5"
